<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Valmu Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-shell">
        <section class="login-panel glass-panel">
            <!-- Simplified login: logo + compact form -->
            <img src="assets/logo.png" alt="Valmu Logo" class="login-panel-logo">
            <div class="login-panel-head">
                <p class="login-kicker">Ingreso</p>
                <h2>Bienvenido</h2>
                <p class="login-copy">Ingresa tus datos para continuar.</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <div class="input-shell">
                        <span class="input-icon" aria-hidden="true">👤</span>
                        <input type="text" id="username" required placeholder="Tu usuario">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <div class="input-shell">
                        <span class="input-icon" aria-hidden="true">🔒</span>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                </div>

                <div id="login-access-preview" class="login-access-preview" aria-live="polite">
                    <span class="login-access-dot"></span>
                    <span id="login-access-text">Acceso a Valmu</span>
                </div>

                <div id="login-error" class="error-message"></div>

                <button type="submit" class="btn btn-primary btn-block" id="btn-login">
                    Entrar
                </button>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/services/session.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
